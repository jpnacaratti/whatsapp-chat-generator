  .msgs::-webkit-scrollbar { display:none; }
  .chip { align-self:center; background:var(--chip); color:var(--chip-text); font-size:13.5rem; font-weight:500; height:28rem; line-height:28rem; padding:0 10rem; border-radius:8rem; box-shadow:0 1px 1px rgba(0,0,0,.08); margin-bottom:12rem; }
  .notice { align-self:center; width:309rem; background:var(--notice); color:var(--notice-text); font-size:14.3rem; line-height:16.8rem; text-align:center; padding:8rem 17rem 9rem; border-radius:10rem; margin-bottom:10rem; box-shadow:0 1px 1px rgba(0,0,0,.05); }
  .notice svg { display:inline-block; width:9rem; height:11rem; vertical-align:-1rem; margin-right:4rem; fill:var(--lock); }
  .notice b { font-weight:700; }
  .m { position:relative; max-width:78%; padding:5rem 8rem 4rem 9rem; font-size:15.5rem; line-height:20rem; border-radius:9rem; color:var(--text); margin-top:3rem; box-shadow:0 1px 1px rgba(0,0,0,.1); word-wrap:break-word; }
  .m.in { align-self:flex-start; background:var(--bubble-in); }
  .m.out { align-self:flex-end; background:var(--bubble-out); }
  .m.first { margin-top:9rem; }
  .m.in.first { border-top-left-radius:0; } .m.out.first { border-top-right-radius:0; }
  .m .meta { float:right; margin:7rem 0 -3rem 10rem; font-size:11rem; line-height:14rem; color:var(--meta); display:flex; align-items:center; gap:3rem; }
  .tail { position:absolute; top:0; width:8rem; height:13rem; }
  .in .tail { left:-8rem; fill:var(--bubble-in); } .out .tail { right:-8rem; fill:var(--bubble-out); transform:scaleX(-1); }
  .tick { width:16rem; height:11rem; }
  .composer { height:62rem; flex:none; position:relative; z-index:2; }
  .pill { position:absolute; left:9rem; top:4rem; width:311rem; height:52rem; border-radius:26rem; background:var(--pill); box-shadow:0 1px 2px rgba(0,0,0,.12); display:flex; align-items:center; }
  .pill .sticker { margin-left:14rem; }
  .pill input { flex:1; min-width:0; border:0; outline:0; background:transparent; font:inherit; font-size:19rem; color:var(--text); margin-left:12rem; caret-color:#1eac62; height:100%; }
  .pill input::placeholder { color:var(--placeholder); }
  .pill .clip { margin-right:25rem; } .pill .cam { margin-right:17rem; }
  .mic { position:absolute; left:331rem; top:4rem; width:52rem; height:52rem; border-radius:50%; background:var(--mic); display:grid; place-items:center; cursor:pointer; }
  .tg { position:absolute; left:57rem; top:11rem; width:39rem; height:39rem; border-radius:50%; opacity:0; cursor:pointer; z-index:5; }

    <div class="mic" id="send"><svg id="sendIcon" style="width:26rem;height:26rem" viewBox="0 0 24 24" fill="#fff"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.900V22h2v-3.100A7 7 0 0 0 19 12z"/></svg></div>
  </div>
  <div class="tg" id="theme" title="Alternar tema"></div>
</div>

<script>
  const MIC='<path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.900V22h2v-3.100A7 7 0 0 0 19 12z"/>';
  const SEND='<path d="M3.400 20.400l17.500-7.500a1 1 0 0 0 0-1.800L3.400 3.600a1 1 0 0 0-1.400 1.200L4 11l9 1-9 1-2 6.200a1 1 0 0 0 1.400 1.200z"/>';
  const TAIL='<svg class="tail" viewBox="0 0 8 13"><path d="M5.188 1H0v11.193l6.467-8.625C7.526 2.156 6.958 1 5.188 1z"/></svg>';
  const TICK='<svg class="tick" viewBox="0 0 16 11" fill="none" stroke="#53bdeb" stroke-width="1.500" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6l3 3 6.500-8M6.500 8.500l.8.8L14.500 1"/></svg>';
  const root=document.documentElement, msgs=document.getElementById('msgs'), input=document.getElementById('in'), icon=document.getElementById('sendIcon'), cam=document.getElementById('cam');
  if (matchMedia('(prefers-color-scheme: dark)').matches) root.dataset.theme='dark';
  document.getElementById('theme').onclick=()=>root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';
  let last=null;
  const now=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  function send(){
    const v=input.value.trim(); if(!v) return;
    const first=last!=='out'; last='out';
    const d=document.createElement('div'); d.className='m out'+(first?' first':'');
    d.innerHTML=(first?TAIL:'')+'<span></span><span class="meta">'+now()+TICK+'</span>';
    d.children[first?1:0].textContent=v; msgs.append(d); msgs.scrollTop=msgs.scrollHeight;
    input.value=''; sync();
  }
  function sync(){ const t=input.value.trim(); icon.innerHTML=t?SEND:MIC; cam.style.display=t?'none':'block'; }
  input.addEventListener('input',sync);
  input.addEventListener('keydown',e=>e.key==='Enter'&&send());
  document.getElementById('send').onclick=send;
</script>
</body>
</html>
