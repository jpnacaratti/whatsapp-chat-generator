<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WhatsApp Chat Generator</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="screen" id="upload">
  <div class="card">
    <h1>WhatsApp Chat Generator</h1>
    <p>Envie o arquivo <b>.json</b> da conversa. Ela é montada na tela no formato do celular; você rola até o ponto desejado e exporta um PNG em alta resolução.</p>
    <label class="drop" id="drop">
      <b>Clique para escolher o JSON</b>
      ou arraste o arquivo para cá
      <input type="file" id="file" accept=".json,application/json" hidden>
    </label>
    <div class="actions"><button class="btn" id="sample" type="button">Usar conversa de exemplo</button></div>
    <div class="error" id="error" hidden></div>
  </div>
</div>

<div class="screen" id="viewer" hidden>
  <div class="bar">
    <button class="btn" id="back" type="button">← Trocar JSON</button>
    <span class="spacer"></span>
    <button class="btn" id="themeBtn" type="button" title="Alternar tema">◐ Tema</button>
    <select id="res" title="Resolução do PNG">
      <option value="2">2x · 787×1600</option>
      <option value="3" selected>3x · 1181×2400</option>
      <option value="4">4x · 1574×3200</option>
    </select>
    <button class="btn primary" id="export" type="button">Exportar PNG</button>
  </div>
<div class="phone">
  <header>
    <svg class="back" width="24rem" height="24rem" viewBox="0 0 24 24" fill="var(--icon)" style="width:24rem;height:24rem"><path d="M20 11H7.8l5.600-5.600L12 4l-8 8 8 8 1.400-1.400L7.800 13H20z"/></svg>
    <div class="av" id="avatar"><svg viewBox="0 0 40 40" style="width:100%;height:100%"><rect width="40" height="40" fill="#8d9ba3"/><circle cx="20" cy="15" r="7" fill="#dfe5e8"/><path d="M5 40c0-9 6.500-14 15-14s15 5 15 14z" fill="#dfe5e8"/></svg></div>
    <div class="nm" id="contactName">Teste M</div>
    <svg class="ic" style="left:258rem;width:25rem;height:25rem" viewBox="0 0 24 24" fill="var(--icon)"><path d="M4 20c-.55 0-1.02-.2-1.41-.59-.4-.39-.59-.86-.59-1.41V6c0-.55.2-1.02.59-1.41C2.98 4.19 3.45 4 4 4h12c.55 0 1.02.2 1.41.59.4.39.59.86.59 1.41v4.5l3.15-3.15c.17-.17.35-.2.55-.13.2.09.3.25.3.48v8.6c0 .23-.1.4-.3.47-.2.09-.38.05-.55-.12L18 13.5V18c0 .55-.2 1.02-.59 1.41-.39.4-.86.59-1.41.59H4Zm0-2h12V6H4v12Z"/></svg>
    <svg class="ic" style="left:311rem;width:25rem;height:25rem" viewBox="0 0 24 24" fill="var(--icon)"><path d="M19.95 21c-2.08 0-4.14-.45-6.17-1.36a18.3 18.3 0 0 1-5.55-3.87 18.47 18.47 0 0 1-3.87-5.54C3.46 8.18 3 6.13 3 4.04A1.02 1.02 0 0 1 4.05 3H8.1c.23 0 .44.08.63.24a.9.9 0 0 1 .32.56l.65 3.5c.03.27.03.5-.02.67-.05.19-.15.35-.28.48L6.97 10.9c.34.62.73 1.21 1.2 1.79.45.57.96 1.13 1.5 1.66A17.59 17.59 0 0 0 13.1 17l2.35-2.35a1.61 1.61 0 0 1 1.3-.4l3.45.7c.23.07.43.19.57.36.16.18.23.37.23.59v4.05A1.02 1.02 0 0 1 19.95 21ZM6.03 9l1.64-1.65L7.25 5H5.03c.08.68.2 1.36.34 2.03.16.66.37 1.32.66 1.97Zm8.95 8.95a12.42 12.42 0 0 0 4.02 1v-2.2l-2.35-.48-1.67 1.68Z"/></svg>
    <svg class="ic" style="left:356.25rem;top:18rem;width:26rem;height:26rem" viewBox="0 0 24 24" fill="var(--icon)"><path d="M12 20c-.55 0-1.02-.2-1.41-.59-.4-.39-.59-.86-.59-1.41 0-.55.2-1.02.59-1.41.39-.4.86-.59 1.41-.59.55 0 1.02.2 1.41.59.4.39.59.86.59 1.41 0 .55-.2 1.02-.59 1.41-.39.4-.86.59-1.41.59Zm0-6c-.55 0-1.02-.2-1.41-.59-.4-.39-.59-.86-.59-1.41 0-.55.2-1.02.59-1.41.39-.4.86-.59 1.41-.59.55 0 1.02.2 1.41.59.4.39.59.86.59 1.41 0 .55-.2 1.02-.59 1.41-.39.4-.86.59-1.41.59Zm0-6c-.55 0-1.02-.2-1.41-.59-.4-.39-.59-.86-.59-1.41 0-.55.2-1.02.59-1.41.39-.4.86-.59 1.41-.59.55 0 1.02.2 1.41.59.4.39.59.86.59 1.41 0 .55-.2 1.02-.59 1.41-.39.4-.86.59-1.41.59Z"/></svg>
  </header>

  <div class="msgs" id="msgs"><div class="thread" id="thread"></div></div>

  <div class="composer">
    <div class="pill">
      <svg class="sticker" style="width:26rem;height:26rem" viewBox="0 0 24 24" fill="var(--pill-icon)"><path d="M8.5 10.25a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Zm8.5-1.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z"/><path fill-rule="evenodd" clip-rule="evenodd" d="M16.82 19.98A6.97 6.97 0 0 1 12 22H9.27A7.27 7.27 0 0 1 2 14.73V9.27A7.27 7.27 0 0 1 9.27 2h5.46A7.27 7.27 0 0 1 22 9.27v2.54c0 1.94-.77 3.8-2.15 5.17l-3.03 3ZM14.72 4H9.28A5.27 5.27 0 0 0 4 9.27v5.46A5.27 5.27 0 0 0 9.27 20h2.06a.9.9 0 0 0 .68-.88l-.02-2.26v-.11a5.5 5.5 0 0 1-4.65-2.6.6.6 0 0 1 .03-.6c.12-.2.3-.3.53-.3h5.7a4.8 4.8 0 0 1 3.22-1.23l2.26.01c.5 0 .9-.4.9-.9V9.07H20A5.27 5.27 0 0 0 14.73 4Zm-.71 15.11c0 .15-.01.3-.04.44a4.96 4.96 0 0 0 1.44-.99l3.03-3c.46-.46.83-.99 1.09-1.56-.15.02-.3.03-.46.03h-2.26A2.8 2.8 0 0 0 14 16.84l.02 2.26Z"/></svg>
      <input id="in" placeholder="Mensagem" autocomplete="off">
      <svg class="clip" style="width:24rem;height:24rem" viewBox="0 0 24 24" fill="var(--pill-icon)"><path d="M18 15.75c0 1.73-.6 3.2-1.82 4.43A6.03 6.03 0 0 1 11.75 22a6 6 0 0 1-4.42-1.82 6.03 6.03 0 0 1-1.83-4.43V6.5c0-1.25.44-2.31 1.31-3.19A4.34 4.34 0 0 1 10 2c1.25 0 2.31.44 3.19 1.31A4.34 4.34 0 0 1 14.5 6.5v8.75c0 .77-.27 1.42-.8 1.95s-1.18.8-1.95.8-1.42-.27-1.95-.8a2.65 2.65 0 0 1-.8-1.95V7a1 1 0 0 1 2 0v8.25a.73.73 0 0 0 .75.75.73.73 0 0 0 .75-.75V6.5c-.02-.7-.26-1.3-.74-1.78A2.37 2.37 0 0 0 10 4c-.7 0-1.3.24-1.78.72A2.41 2.41 0 0 0 7.5 6.5v9.25a4 4 0 0 0 1.22 3.01A4.14 4.14 0 0 0 11.75 20c1.17 0 2.16-.41 2.97-1.24A4.3 4.3 0 0 0 16 15.75V7a1 1 0 1 1 2 0v8.75Z"/></svg>
      <svg class="cam" id="cam" style="width:23.3rem;height:21.5rem" viewBox="0 0 26 24" fill="none" stroke="var(--pill-icon)" stroke-width="2" stroke-linejoin="round"><path d="M9 4h8l1.800 2.500H22a2 2 0 0 1 2 2V19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8.500a2 2 0 0 1 2-2h3.200z"/><circle cx="13" cy="13.500" r="4"/></svg>
    </div>
    <div class="mic" id="send"><svg id="sendIcon" style="width:26rem;height:26rem" viewBox="0 0 24 24" fill="#fff"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.900V22h2v-3.100A7 7 0 0 0 19 12z"/></svg></div>
  </div>
</div>
</div>

<script src="assets/vendor/html-to-image.min.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
